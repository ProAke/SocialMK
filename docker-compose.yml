services:
  api:
    build: .
    image: socialmk:beta
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      SOCIALMK_DATA_DIR: /data
      SOCIALMK_JWT_SECRET: ${SOCIALMK_JWT_SECRET:-}
    volumes:
      - socialmk-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  socialmk-data:
